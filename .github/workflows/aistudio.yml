name: Build AI Studio for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, codex/aistudio-download]
    paths:
      - 'AIStudio/**'
      - '.github/workflows/aistudio.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build application and installer
        shell: pwsh
        run: ./AIStudio/build-windows.ps1
      - name: Verify artifacts
        shell: pwsh
        run: |
          if (!(Test-Path AIStudio/publish/AIStudio.exe)) { throw 'AIStudio.exe not found' }
          if (!(Test-Path AIStudio/artifacts/AIStudio-Setup-x64.exe)) { throw 'Installer not found' }
          Get-Item AIStudio/publish/AIStudio.exe, AIStudio/artifacts/AIStudio-Setup-x64.exe | Format-Table Name,Length,FullName
      - uses: actions/upload-artifact@v4
        with:
          name: AIStudio-Windows-x64
          path: |
            AIStudio/publish/**
            AIStudio/artifacts/AIStudio-Setup-x64.exe
          if-no-files-found: error

